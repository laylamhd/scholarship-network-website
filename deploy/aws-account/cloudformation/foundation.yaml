AWSTemplateFormatVersion: "2010-09-09"
Description: >
  TBHF Scholars Network on AWS (own account) - FOUNDATION stack. The parts that
  stay up all the time and cost almost nothing: encryption key, secrets,
  S3 buckets, container registries, build project, e-mail sender, alerts,
  budget, audit trail and threat detection. The expensive parts (network,
  servers, database, CDN) live in the separate RUNTIME stack (runtime.yaml),
  which start.sh / stop.sh create and delete.

Parameters:
  ProjectName:
    Type: String
    Default: tbhf
    AllowedPattern: "^[a-z][a-z0-9-]{1,15}$"
  AlertEmail:
    Type: String
    Description: Receives alarm, budget and pipeline e-mails (confirm the SNS subscription e-mail once).
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  SenderEmail:
    Type: String
    Default: ""
    Description: Address the website sends password-reset e-mails from (Amazon SES sends a verification e-mail to it). Empty = no e-mail.
  MonthlyBudgetUSD:
    Type: Number
    Default: 40
    MinValue: 1
  EnableGuardDuty:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  EnablePipeline:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Create a CodePipeline that deploys every push to GitHub (needs the GitHub connection approved once in the console).
  GitHubRepository:
    Type: String
    Default: laylamhd/scholarship-network-website
  GitHubBranch:
    Type: String
    Default: aws-deployment

Conditions:
  HasSender: !Not [!Equals [!Ref SenderEmail, ""]]
  WantGuardDuty: !Equals [!Ref EnableGuardDuty, "true"]
  WantPipeline: !Equals [!Ref EnablePipeline, "true"]

Resources:
  # ------------------------------------------------------------ encryption
  Key:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "${ProjectName} - encrypts the database, its backups and the secrets"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministers
            Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"
  KeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${ProjectName}"
      TargetKeyId: !Ref Key

  # ------------------------------------------------------------ secrets
  # Generated by AWS; nobody ever types or sees them unless they look them up.
  DbMasterPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/db-master-password"
      Description: Password of tbhf_admin, the RDS master user (used only by the ops task)
      KmsKeyId: !Ref Key
      GenerateSecretString: { PasswordLength: 32, ExcludePunctuation: true }
  AppDbPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/app-db-password"
      Description: Password of tbhf_app, the database login the website and the Lambda use
      KmsKeyId: !Ref Key
      GenerateSecretString: { PasswordLength: 32, ExcludePunctuation: true }
  SessionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/session-secret"
      Description: Signs the website's login cookies
      KmsKeyId: !Ref Key
      GenerateSecretString: { PasswordLength: 48, ExcludePunctuation: true }
  SeedPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/seed-password"
      Description: First password of every member imported from Supabase (they can reset it by e-mail)
      KmsKeyId: !Ref Key
      GenerateSecretString: { PasswordLength: 16, ExcludePunctuation: true }
  AdminCodeSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/admin-code"
      Description: Admin access code (replaces the one in the Supabase export)
      KmsKeyId: !Ref Key
      GenerateSecretString: { PasswordLength: 20, ExcludePunctuation: true }
  OriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/origin-verify"
      Description: Header value CloudFront adds so the load balancer can reject anything that skipped CloudFront
      KmsKeyId: !Ref Key
      GenerateSecretString: { PasswordLength: 32, ExcludePunctuation: true }

  # ------------------------------------------------------------ S3
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration:
        { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: ForgetOldVersions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
      Tags: [{ Key: Project, Value: !Ref ProjectName }]
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration:
        { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: OldBuilds
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 7 }
          - Id: OldLambdaPackages
            Status: Enabled
            Prefix: lambda/
            ExpirationInDays: 60
      Tags: [{ Key: Project, Value: !Ref ProjectName }]
  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt ArtifactsBucket.Arn, !Sub "${ArtifactsBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # ------------------------------------------------------------ container registries
  WebRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-web"
      EmptyOnDelete: true
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep the 10 newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'
  OpsRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-ops"
      EmptyOnDelete: true
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep the 5 newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}'

  # ------------------------------------------------------------ build (CodeBuild)
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: codebuild.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}-*"
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: [!GetAtt WebRepository.Arn, !GetAtt OpsRepository.Arn]
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: !Sub "${ArtifactsBucket.Arn}/*"
              - Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !GetAtt ArtifactsBucket.Arn
              - Effect: Allow
                Action: [lambda:GetFunction, lambda:UpdateFunctionCode]
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-reminders"
  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ProjectName}-build"
      Description: Builds the website image, the ops image and the reminders Lambda from a source zip in S3 (scripts/build.sh)
      ServiceRole: !GetAtt BuildRole.Arn
      Source:
        Type: S3
        Location: !Sub "${ArtifactsBucket}/source/source.zip"
        BuildSpec: deploy/aws-account/codebuild/buildspec.yml
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        PrivilegedMode: true
        EnvironmentVariables:
          - { Name: WEB_REPO_URI, Value: !GetAtt WebRepository.RepositoryUri }
          - { Name: OPS_REPO_URI, Value: !GetAtt OpsRepository.RepositoryUri }
          - { Name: ARTIFACTS_BUCKET, Value: !Ref ArtifactsBucket }
          - { Name: REMINDERS_FUNCTION, Value: !Sub "${ProjectName}-reminders" }
      TimeoutInMinutes: 30
      LogsConfig: { CloudWatchLogs: { Status: ENABLED, GroupName: !Sub "/aws/codebuild/${ProjectName}-build" } }

  # ------------------------------------------------------------ CI/CD (optional)
  GitHubConnection:
    Type: AWS::CodeConnections::Connection
    Condition: WantPipeline
    Properties:
      ConnectionName: !Sub "${ProjectName}-github"
      ProviderType: GitHub
  PipelineBuildProject:
    Type: AWS::CodeBuild::Project
    Condition: WantPipeline
    Properties:
      Name: !Sub "${ProjectName}-pipeline-build"
      ServiceRole: !GetAtt BuildRole.Arn
      Source: { Type: CODEPIPELINE, BuildSpec: deploy/aws-account/codebuild/buildspec.yml }
      Artifacts: { Type: CODEPIPELINE }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        PrivilegedMode: true
        EnvironmentVariables:
          - { Name: WEB_REPO_URI, Value: !GetAtt WebRepository.RepositoryUri }
          - { Name: OPS_REPO_URI, Value: !GetAtt OpsRepository.RepositoryUri }
          - { Name: ARTIFACTS_BUCKET, Value: !Ref ArtifactsBucket }
          - { Name: REMINDERS_FUNCTION, Value: !Sub "${ProjectName}-reminders" }
      TimeoutInMinutes: 30
      LogsConfig: { CloudWatchLogs: { Status: ENABLED, GroupName: !Sub "/aws/codebuild/${ProjectName}-pipeline-build" } }
  PipelineRole:
    Type: AWS::IAM::Role
    Condition: WantPipeline
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: codepipeline.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketVersioning]
                Resource: [!GetAtt ArtifactsBucket.Arn, !Sub "${ArtifactsBucket.Arn}/*"]
              - Effect: Allow
                Action: [codestar-connections:UseConnection, codeconnections:UseConnection]
                Resource: !Ref GitHubConnection
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource: !GetAtt PipelineBuildProject.Arn
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                  - ecs:TagResource
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: "*"
                Condition: { StringEquals: { "iam:PassedToService": ecs-tasks.amazonaws.com } }
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Condition: WantPipeline
    Properties:
      Name: !Sub "${ProjectName}-deploy"
      PipelineType: V2
      ExecutionMode: QUEUED
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore: { Type: S3, Location: !Ref ArtifactsBucket }
      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            SourceActionName: Source
            Push: [{ Branches: { Includes: [!Ref GitHubBranch] } }]
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId: { Category: Source, Owner: AWS, Provider: CodeStarSourceConnection, Version: "1" }
              Configuration:
                ConnectionArn: !Ref GitHubConnection
                FullRepositoryId: !Ref GitHubRepository
                BranchName: !Ref GitHubBranch
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts: [{ Name: Code }]
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: "1" }
              Configuration: { ProjectName: !Ref PipelineBuildProject }
              InputArtifacts: [{ Name: Code }]
              OutputArtifacts: [{ Name: Images }]
        - Name: Deploy
          Actions:
            - Name: RollingUpdate
              ActionTypeId: { Category: Deploy, Owner: AWS, Provider: ECS, Version: "1" }
              Configuration:
                ClusterName: !Sub "${ProjectName}-cluster"
                ServiceName: !Sub "${ProjectName}-web"
                FileName: imagedefinitions.json
                DeploymentTimeout: "20"
              InputArtifacts: [{ Name: Images }]

  # ------------------------------------------------------------ e-mail (SES)
  SenderIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: HasSender
    Properties:
      EmailIdentity: !Ref SenderEmail

  # ------------------------------------------------------------ backups (AWS Backup)
  # The vault lives here, not in the runtime stack, so stop.sh can delete the
  # runtime stack while the recovery points are kept.
  BackupVault:
    Type: AWS::Backup::BackupVault
    Properties:
      BackupVaultName: !Sub "${ProjectName}-vault"
      EncryptionKeyArn: !GetAtt Key.Arn

  # ------------------------------------------------------------ alerts + budget
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-alerts"
      Subscription: [{ Protocol: email, Endpoint: !Ref AlertEmail }]
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${ProjectName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUSD, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

  # ------------------------------------------------------------ audit + threat detection
  TrailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration:
        { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      LifecycleConfiguration:
        Rules: [{ Id: Expire, Status: Enabled, ExpirationInDays: 90 }]
  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AclCheck
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
            Condition: { StringEquals: { "aws:SourceArn": !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${ProjectName}-audit" } }
          - Sid: Write
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub "${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                "s3:x-amz-acl": bucket-owner-full-control
                "aws:SourceArn": !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${ProjectName}-audit"
  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: !Sub "${ProjectName}-audit"
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
  ThreatDetector:
    Type: AWS::GuardDuty::Detector
    Condition: WantGuardDuty
    Properties:
      Enable: true
      FindingPublishingFrequency: SIX_HOURS

Outputs:
  KeyArn:
    Value: !GetAtt Key.Arn
    Export: { Name: !Sub "${ProjectName}-foundation-KeyArn" }
  MediaBucket:
    Value: !Ref MediaBucket
    Export: { Name: !Sub "${ProjectName}-foundation-MediaBucket" }
  MediaBucketArn:
    Value: !GetAtt MediaBucket.Arn
    Export: { Name: !Sub "${ProjectName}-foundation-MediaBucketArn" }
  MediaBucketDomain:
    Value: !GetAtt MediaBucket.RegionalDomainName
    Export: { Name: !Sub "${ProjectName}-foundation-MediaBucketDomain" }
  ArtifactsBucket:
    Value: !Ref ArtifactsBucket
    Export: { Name: !Sub "${ProjectName}-foundation-ArtifactsBucket" }
  WebRepositoryUri:
    Value: !GetAtt WebRepository.RepositoryUri
    Export: { Name: !Sub "${ProjectName}-foundation-WebRepositoryUri" }
  OpsRepositoryUri:
    Value: !GetAtt OpsRepository.RepositoryUri
    Export: { Name: !Sub "${ProjectName}-foundation-OpsRepositoryUri" }
  DbMasterPasswordSecretArn:
    Value: !Ref DbMasterPasswordSecret
    Export: { Name: !Sub "${ProjectName}-foundation-DbMasterPasswordSecretArn" }
  BackupVaultName:
    Value: !Ref BackupVault
    Export: { Name: !Sub "${ProjectName}-foundation-BackupVaultName" }
  AppDbPasswordSecretArn:
    Value: !Ref AppDbPasswordSecret
    Export: { Name: !Sub "${ProjectName}-foundation-AppDbPasswordSecretArn" }
  SessionSecretArn:
    Value: !Ref SessionSecret
    Export: { Name: !Sub "${ProjectName}-foundation-SessionSecretArn" }
  SeedPasswordSecretArn:
    Value: !Ref SeedPasswordSecret
    Export: { Name: !Sub "${ProjectName}-foundation-SeedPasswordSecretArn" }
  AdminCodeSecretArn:
    Value: !Ref AdminCodeSecret
    Export: { Name: !Sub "${ProjectName}-foundation-AdminCodeSecretArn" }
  OriginVerifySecretArn:
    Value: !Ref OriginVerifySecret
    Export: { Name: !Sub "${ProjectName}-foundation-OriginVerifySecretArn" }
  AlertTopicArn:
    Value: !Ref AlertTopic
    Export: { Name: !Sub "${ProjectName}-foundation-AlertTopicArn" }
  SenderEmail:
    Value: !If [HasSender, !Ref SenderEmail, "none"]
    Export: { Name: !Sub "${ProjectName}-foundation-SenderEmail" }
  BuildProject:
    Value: !Ref BuildProject
  GitHubConnectionArn:
    Condition: WantPipeline
    Value: !Ref GitHubConnection
    Description: Approve it once in the console (Developer Tools > Settings > Connections > Update pending connection)
